name: Windows build (development)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/temporary-video-sharing
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Package Windows application
        run: npm run dist:win
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VRLink-Browser-Windows-development
          path: dist/*.zip
          if-no-files-found: error
