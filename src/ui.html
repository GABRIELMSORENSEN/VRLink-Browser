<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRLink Browser</title><link rel="stylesheet" href="ui.css"></head><body>
<header><button id="home" title="Google">◈</button><button id="back" title="Voltar">‹</button><button id="forward" title="Avançar">›</button><button id="reload" title="Recarregar">↻</button><form id="address"><input id="url" autocomplete="off" spellcheck="false" placeholder="Pesquise no Google ou cole um link"><button>Ir</button></form><button id="vr-menu" title="Abrir detector de vídeos">VR <span id="count">0</span></button><button id="shield" title="Bloqueios locais">◉ <span id="blocked">0</span></button></header>
<aside id="corner"><section id="panel" hidden><div class="panel-head"><strong>VÍDEOS DA PÁGINA</strong><button id="close" title="Fechar">×</button></div><button id="share-local" class="scan">SELECIONAR MP4 LOCAL</button><button id="stop-local" class="scan">PARAR LINK LOCAL</button><button id="scan" class="scan">VERIFICAR PÁGINA AGORA</button><p id="hint">Inicie o vídeo no site. A fonte aparece aqui e você pode preparar um link para o player do VRChat.</p><div id="media"></div><footer>Links locais funcionam apenas neste computador. Compartilhamento HTTPS público ainda não está disponível.</footer></section></aside><div id="toast" role="status"></div><script src="ui.js"></script></body></html>
