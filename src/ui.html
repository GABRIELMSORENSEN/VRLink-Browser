<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRLink Browser</title><link rel="stylesheet" href="ui.css"></head><body>
<header><button id="home" title="Google">◈</button><button id="back" title="Voltar">‹</button><button id="forward" title="Avançar">›</button><button id="reload" title="Recarregar">↻</button><form id="address"><input id="url" autocomplete="off" spellcheck="false" placeholder="Pesquise no Google ou cole um link"><button>Ir</button></form><button id="shield" title="Bloqueios locais">◉ <span id="blocked">0</span></button></header>
<aside id="corner"><button id="toggle" aria-expanded="false">VR <span id="count">0</span></button><section id="panel" hidden><div class="panel-head"><strong>MÍDIA DIRETA</strong><button id="close" title="Fechar">×</button></div><p id="hint">Abra uma página com vídeo. O link só aparece se o site expuser uma mídia direta.</p><div id="media"></div><footer>Sem download, sem quebra de DRM. Copie e cole no player do mundo VRChat.</footer></section></aside><div id="toast" role="status"></div><script src="ui.js"></script></body></html>
